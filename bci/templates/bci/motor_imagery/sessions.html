{% extends 'bci/session_list.html' %}

{% block title %}Motor Imagery Sessions - BCI{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'bci:dashboard' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'bci:motor_imagery_dashboard' %}">Motor Imagery</a></li>
        <li class="breadcrumb-item active">Sessions</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="fas fa-brain me-2 text-primary"></i>Motor Imagery Sessions
            </h1>
            <div>
                <a href="{% url 'bci:session_upload' %}?approach=motor_imagery" class="btn btn-primary me-2">
                    <i class="fas fa-upload me-1"></i>Upload Session
                </a>
                <a href="{% url 'bci:multiple_session_upload' %}?approach=motor_imagery" class="btn btn-outline-primary">
                    <i class="fas fa-upload me-1"></i>Upload Multiple
                </a>
            </div>
        </div>
    </div>
</div>

{{ block.super }}
{% endblock %}
