{% extends "layout.html" %}

{% block title %}
    Start Trial
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h1 class="mb-0">Start EEG Trial</h1>
        </div>
        <div class="card-body">
            <form method="post" action="{% url 'word_trials' %}" id="trialForm">
                {% csrf_token %}
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="participant_select" class="form-label">Select Existing Participant:</label>
                            <select class="form-select" id="participant_select" name="existing_participant">
                                <option value="">-- Select Existing Participant --</option>
                                {% for participant in existing_participants %}
                                    <option value="{{ participant }}">{{ participant }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="participant_name" class="form-label">Or Create New Participant:</label>
                            <input type="text" class="form-control" name="participant_name" id="participant_name" placeholder="Enter new participant name">
                        </div>
                    </div>
                </div>
                
                <!-- Microphone Selection -->
                <div class="form-group mb-4">
                    <label for="microphoneSelect" class="form-label"><i class="bi bi-mic"></i> Select Microphone:</label>
                    <div class="input-group">
                        <select id="microphoneSelect" name="microphone_index" class="form-select">
                            <option value="">Loading microphones...</option>
                        </select>
                        <button type="button" id="refreshMicsBtn" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                    <div class="form-text">This microphone will be used for all recordings in this session.</div>
                    <div id="microphoneStatus" class="mt-2"></div>
                </div>
                
                <div class="form-group mb-4">
                    <label class="form-label">Select Word:</label>
                    <div class="row word-selection">
                        {% for word in unique_words %}
                            <div class="col-md-4 mb-3">
                                <div class="card word-card">
                                    <div class="card-body text-center">
                                        <h3>{{ word }}</h3>
                                        <input type="radio" name="word" id="word_{{ word }}" value="{{ word }}" class="form-check-input word-radio" required>
                                        <label for="word_{{ word }}" class="btn btn-outline-primary w-100 mt-2">Select</label>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-lg btn-success" id="startTrialBtn">
                        <i class="bi bi-play-circle-fill me-2"></i>Start Trial
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Debug link at the bottom -->
<div class="container mt-3 mb-5">
    <div class="row">
        <div class="col text-center">
            <a href="{% url 'debug_audio_devices' %}" target="_blank" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-wrench"></i> Debug Audio Devices
            </a>
        </div>
    </div>
</div>

<style>
    .word-card {
        transition: all 0.3s ease;
        cursor: pointer;
        border: 2px solid #e9ecef;
    }
    
    .word-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    .word-radio {
        position: absolute;
        opacity: 0;
    }
    
    .word-radio:checked + label {
        background-color: #0d6efd;
        color: white;
    }
    
    .word-selection label {
        cursor: pointer;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Load microphones
        loadMicrophones();
        
        // Refresh microphones button
        const refreshMicsBtn = document.getElementById('refreshMicsBtn');
        if (refreshMicsBtn) {
            refreshMicsBtn.addEventListener('click', loadMicrophones);
        }
        
        // Make the entire word card clickable
        const wordCards = document.querySelectorAll('.word-card');
        wordCards.forEach(card => {
            card.addEventListener('click', function() {
                const radio = this.querySelector('input[type="radio"]');
                radio.checked = true;
                
                // Update all labels to show selection state
                document.querySelectorAll('.word-radio').forEach(input => {
                    const label = input.nextElementSibling;
                    if (input.checked) {
                        label.classList.remove('btn-outline-primary');
                        label.classList.add('btn-primary');
                    } else {
                        label.classList.remove('btn-primary');
                        label.classList.add('btn-outline-primary');
                    }
                });
            });
        });
        
        // Form validation
        const form = document.getElementById('trialForm');
        form.addEventListener('submit', function(e) {
            const existingParticipant = document.getElementById('participant_select').value;
            const newParticipant = document.getElementById('participant_name').value.trim();
            
            if (!existingParticipant && !newParticipant) {
                e.preventDefault();
                alert('Please select an existing participant or enter a new participant name.');
                return false;
            }
            
            const wordSelected = document.querySelector('input[name="word"]:checked');
            if (!wordSelected) {
                e.preventDefault();
                alert('Please select a word for the trial.');
                return false;
            }
            
            return true;
        });
        
        // Toggle between existing and new participant
        const existingSelect = document.getElementById('participant_select');
        const newInput = document.getElementById('participant_name');
        
        existingSelect.addEventListener('change', function() {
            if (this.value) {
                newInput.value = '';
            }
        });
        
        newInput.addEventListener('input', function() {
            if (this.value.trim()) {
                existingSelect.value = '';
            }
        });
    });
    
    // Function to load microphones with better organization
    function loadMicrophones() {
        const microphoneSelect = document.getElementById('microphoneSelect');
        const microphoneStatus = document.getElementById('microphoneStatus');
        const refreshMicsBtn = document.getElementById('refreshMicsBtn');
        
        if (!microphoneSelect) return;
        
        // Only update the button if it exists
        if (refreshMicsBtn) {
            refreshMicsBtn.disabled = true;
            refreshMicsBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Loading...';
        }
        
        // Update status
        if (microphoneStatus) {
            microphoneStatus.innerHTML = '<div class="alert alert-info"><i class="bi bi-info-circle"></i> Loading microphones...</div>';
        }
        
        // Clear dropdown with a "Loading..." option
        microphoneSelect.innerHTML = '<option value="">Loading microphones...</option>';
        
        console.log('Fetching microphones from server...');
        
        fetch('{% url "get_microphones" %}')
            .then(response => {
                console.log('Response received:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Microphone data received:', data);
                
                if (data.success) {
                    // Save current selection if possible
                    const currentSelection = microphoneSelect.value;
                    
                    // Clear existing options
                    microphoneSelect.innerHTML = '';
                    
                    // Add default option
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Default Microphone';
                    microphoneSelect.appendChild(defaultOption);
                    
                    if (data.microphones && data.microphones.length > 0) {
                        console.log(`Adding ${data.microphones.length} microphones to select box`);
                        
                        // Separate default, WASAPI, and other devices
                        const defaultMics = data.microphones.filter(mic => mic.is_default);
                        const wasapiMics = data.microphones.filter(mic => !mic.is_default && mic.name.toLowerCase().includes('wasapi'));
                        const otherMics = data.microphones.filter(mic => !mic.is_default && !mic.name.toLowerCase().includes('wasapi'));
                        
                        // Add default device(s) first
                        if (defaultMics.length > 0) {
                            const defaultGroup = document.createElement('optgroup');
                            defaultGroup.label = 'Default Device';
                            
                            defaultMics.forEach(mic => {
                                const option = document.createElement('option');
                                option.value = mic.index;
                                option.textContent = `${mic.name} (${mic.channels} ch)`;
                                option.selected = true; // Always select the default
                                defaultGroup.appendChild(option);
                            });
                            
                            microphoneSelect.appendChild(defaultGroup);
                        }
                        
                        // Add WASAPI devices (usually best quality)
                        if (wasapiMics.length > 0) {
                            const wasapiGroup = document.createElement('optgroup');
                            wasapiGroup.label = 'WASAPI Devices (Recommended)';
                            
                            wasapiMics.forEach(mic => {
                                const option = document.createElement('option');
                                option.value = mic.index;
                                option.textContent = `${mic.name} (${mic.channels} ch)`;
                                wasapiGroup.appendChild(option);
                            });
                            
                            microphoneSelect.appendChild(wasapiGroup);
                        }
                        
                        // Add other devices
                        if (otherMics.length > 0) {
                            const otherGroup = document.createElement('optgroup');
                            otherGroup.label = 'Other Devices';
                            
                            otherMics.forEach(mic => {
                                const option = document.createElement('option');
                                option.value = mic.index;
                                option.textContent = `${mic.name} (${mic.channels} ch)`;
                                otherGroup.appendChild(option);
                            });
                            
                            microphoneSelect.appendChild(otherGroup);
                        }
                        
                        // Update status
                        if (microphoneStatus) {
                            microphoneStatus.innerHTML = `<div class="alert alert-success">
                                <i class="bi bi-mic"></i> Found ${data.microphones.length} unique microphones 
                                <button class="btn btn-sm btn-outline-success float-end" type="button" 
                                        onclick="window.open('{% url 'debug_audio_devices' %}', '_blank')">
                                    <i class="bi bi-wrench"></i> Debug
                                </button>
                            </div>`;
                        }
                        
                        // Restore selection if still available
                        if (currentSelection) {
                            // Check all options including those in optgroups
                            const allOptions = [...microphoneSelect.querySelectorAll('option')];
                            const matchingOption = allOptions.find(opt => opt.value === currentSelection);
                            if (matchingOption) {
                                matchingOption.selected = true;
                            }
                        }
                        
                    } else {
                        console.warn('No microphones found in response data');
                        if (microphoneStatus) {
                            microphoneStatus.innerHTML = `<div class="alert alert-warning">
                                <i class="bi bi-exclamation-triangle"></i> No microphones found. 
                                <button class="btn btn-sm btn-outline-warning float-end" type="button" 
                                        onclick="window.open('{% url 'debug_audio_devices' %}', '_blank')">
                                    <i class="bi bi-wrench"></i> Debug
                                </button>
                            </div>`;
                        }
                    }
                } else {
                    console.error('Error getting microphones:', data.error);
                    // Add an error note to the dropdown
                    microphoneSelect.innerHTML = '';
                    
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Default Microphone';
                    microphoneSelect.appendChild(defaultOption);
                    
                    const errorOption = document.createElement('option');
                    errorOption.disabled = true;
                    errorOption.textContent = `Error: ${data.error || 'Failed to load microphones'}`;
                    microphoneSelect.appendChild(errorOption);
                    
                    // Update status
                    if (microphoneStatus) {
                        microphoneStatus.innerHTML = `<div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> Error: ${data.error || 'Failed to load microphones'}
                            <button class="btn btn-sm btn-outline-danger float-end" type="button" 
                                    onclick="window.open('{% url 'debug_audio_devices' %}', '_blank')">
                                <i class="bi bi-wrench"></i> Debug
                            </button>
                        </div>`;
                    }
                }
            })
            .catch(error => {
                console.error('Error fetching microphones:', error);
                // Add an error note to the dropdown
                microphoneSelect.innerHTML = '';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = 'Default Microphone';
                microphoneSelect.appendChild(defaultOption);
                
                const errorOption = document.createElement('option');
                errorOption.disabled = true;
                errorOption.textContent = `Error: ${error.message}`;
                microphoneSelect.appendChild(errorOption);
                
                // Update status
                if (microphoneStatus) {
                    microphoneStatus.innerHTML = `<div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> Error: ${error.message}
                        <button class="btn btn-sm btn-outline-danger float-end" type="button" 
                                onclick="window.open('{% url 'debug_audio_devices' %}', '_blank')">
                            <i class="bi bi-wrench"></i> Debug
                        </button>
                    </div>`;
                }
            })
            .finally(() => {
                // Only update the button if it exists
                if (refreshMicsBtn) {
                    refreshMicsBtn.disabled = false;
                    refreshMicsBtn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Refresh';
                }
            });
    }
</script>
{% endblock content %}
