{% extends 'bci/session_list.html' %}

{% block title %}P300 Sessions - BCI{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'bci:dashboard' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'bci:p300_dashboard' %}">P300</a></li>
        <li class="breadcrumb-item active">Sessions</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="fas fa-eye me-2 text-info"></i>P300 Sessions
            </h1>
            <div>
                <a href="{% url 'bci:session_upload' %}?approach=p300" class="btn btn-info me-2">
                    <i class="fas fa-upload me-1"></i>Upload Session
                </a>
                <a href="{% url 'bci:multiple_session_upload' %}?approach=p300" class="btn btn-outline-info">
                    <i class="fas fa-upload me-1"></i>Upload Multiple
                </a>
            </div>
        </div>
    </div>
</div>

{{ block.super }}
{% endblock %}
