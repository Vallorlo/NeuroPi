{% extends 'bci/prediction_dashboard.html' %}

{% block title %}Motor Imagery Prediction - BCI{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'bci:dashboard' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'bci:motor_imagery_dashboard' %}">Motor Imagery</a></li>
        <li class="breadcrumb-item active">Prediction</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="fas fa-brain me-2 text-primary"></i>Motor Imagery Prediction

            <a href="{% url 'bci:create_prediction_session' %}?approach=motor_imagery" class="btn btn-primary">

            </a>
        </div>
    </div>

{{ block.super }}
{% endblock %}
