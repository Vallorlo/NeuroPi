{% extends 'bci/training_list.html' %}

{% block title %}P300 Training - BCI{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'bci:dashboard' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'bci:p300_dashboard' %}">P300</a></li>
        <li class="breadcrumb-item active">Training</li>

</nav>

{% block content %}
<div class="row">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>

{{ block.super }}
